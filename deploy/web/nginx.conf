worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 1024; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    sendfile on;
    # 访问日志不记录查询参数、认证头、幂等键或正文。
    log_format minimal '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';
    access_log /dev/stdout minimal;
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    server {
        listen 8080;
        root /usr/share/nginx/html;
        index index.html;
        # API文件限制为5MiB另加multipart边界；具体类型/大小/权限仍由售后服务检查。
        client_max_body_size 6m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
        add_header Cache-Control no-store always;

        # 此端点只代表静态服务存活，不能据此宣称交易服务就绪。
        location = /healthz { access_log off; default_type text/plain; return 200 'ok\n'; }

        location ^~ /api/v1/ {
            # Docker DNS运行时解析，gateway容器重建换IP后不依赖重启静态服务。
            resolver 127.0.0.11 valid=10s ipv6=off;
            set $gateway http://gateway:8080;
            proxy_pass $gateway$request_uri;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header Connection '';
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Idempotency-Key $http_idempotency_key;
            proxy_set_header X-User-Id '';
            proxy_set_header X-Caller-Service '';
            proxy_set_header X-Service-Token '';
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 3s;
            proxy_read_timeout 20s;
            proxy_send_timeout 20s;
            # 资金/库存写请求未知时不得由代理重新投递；错误状态和业务信封原样返回。
            proxy_next_upstream off;
            proxy_intercept_errors off;
            proxy_cache off;
        }
        location = /api { return 404; }
        location ^~ /api/ { return 404; }
        location ~ (^|/)\. { return 404; }
        location ~ ^/(internal|channel|callbacks|actuator|system|swagger-ui|v3)(/|$) { return 404; }
        # 哈希资源和脚本缺失应明确404，不能回退HTML掩盖旧版本资源丢失。
        location ^~ /assets/ { try_files $uri =404; }
        location ~* \.(js|mjs|css|map|json|png|jpe?g|webp|svg|ico|woff2?|ttf)$ { try_files $uri =404; }
        # index与SPA历史路由禁止缓存；只发布dist，不暴露源码目录。
        location / { try_files $uri $uri/ /index.html; }
    }
}
